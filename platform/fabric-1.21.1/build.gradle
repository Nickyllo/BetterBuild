plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

description = 'Fabric adapter for Minecraft 1.21.1.'

// Adapters that only touch vanilla classes live here and are shared with the
// NeoForge module for the same Minecraft version — same code, two loaders.
sourceSets.main.java.srcDir '../shared-mc/java'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Official Mojang mappings, deliberately: they are the same names NeoForge and
    // Forge use, which is what lets the shared adapter compile on every loader.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // The brain, bundled into the jar so players need no extra download.
    implementation project(':core')
    include project(':core')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
