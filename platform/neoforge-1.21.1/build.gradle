plugins {
    id 'net.neoforged.moddev' version '2.0.34'
}

description = 'NeoForge adapter for Minecraft 1.21.1.'

// Same vanilla-only adapters as the Fabric module. NeoForge already uses official
// Mojang mappings, which is why this sharing works at all.
sourceSets.main.java.srcDir '../shared-mc/java'

neoForge {
    version = project.neoforge_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        betterbuild {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':core')
}
