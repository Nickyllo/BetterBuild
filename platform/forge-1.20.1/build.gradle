plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
}

description = 'Forge adapter for Minecraft 1.20.1 (Java 17).'

// Same vanilla-only adapters as the 1.21 modules. Official Mojang mappings on every
// loader are what make one copy of this code compile everywhere.
sourceSets.main.java.srcDir '../shared-mc/java'

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run') }
        server { workingDirectory project.file('run') }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':core')
}

// 1.20.1 runs on Java 17; the core already emits 17 bytecode, so nothing to override.
