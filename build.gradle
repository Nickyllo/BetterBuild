plugins {
    id 'java'
}

allprojects {
    group = project.property('group')
    version = project.property('version')

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(
                    (project.findProperty('javaToolchain') ?: '21') as int)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Cross-compile: a modern JDK emitting older bytecode. --release (unlike
        // -source/-target) also checks the API against that version, so a Java 21
        // method cannot slip into code meant to run on 17.
        options.release = ((project.findProperty('javaRelease') ?: '17') as int)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }
}
