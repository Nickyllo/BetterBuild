# Shared by every module.
group=dev.nickyllo.betterbuild
version=0.1.0

# Two separate settings, and the distinction matters.
#
# javaToolchain is the JDK that runs the compiler. javaRelease is the bytecode
# version it emits. Minecraft 1.20.x runs on Java 17 and refuses to load anything
# newer, so the core — shared by every platform module — emits 17 while still being
# compiled by a modern JDK. Modules for newer Minecraft raise javaRelease themselves.
javaToolchain=21
javaRelease=17

anthropicSdkVersion=2.34.0
jacksonVersion=2.18.2
junitVersion=5.11.3

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
