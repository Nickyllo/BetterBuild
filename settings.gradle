pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' ; name = 'Fabric' }
        maven { url = 'https://maven.neoforged.net/releases' ; name = 'NeoForged' }
        maven { url = 'https://maven.minecraftforge.net/' ; name = 'MinecraftForge' }
    }
}

rootProject.name = 'betterbuild'

// The brain. Plain Java, no Minecraft, builds and tests anywhere.
include 'core'

// Platform adapters. Each one targets a single Minecraft version and loader and
// contains nothing but glue. They need the game's toolchain to build, so they are
// opt-in: ./gradlew build works on a bare checkout, and
// ./gradlew -Pplatforms=true build pulls in the loaders.
if (providers.gradleProperty('platforms').getOrElse('false') == 'true') {
    include 'platform:fabric-1.21.1'
    include 'platform:neoforge-1.21.1'
    include 'platform:forge-1.20.1'
}
